name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / NestJS ${{ matrix.nest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        nest: [9, 10]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Use NestJS ${{ matrix.nest }}
        if: matrix.nest == 10
        run: >
          npm install --no-save --no-audit --no-fund
          @nestjs/common@10 @nestjs/core@10 @nestjs/testing@10 @nestjs/platform-express@10

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  pack:
    name: Package contents
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm pack
      - name: Tarball must contain dist and must not contain the KPAX spec
        run: |
          set -e
          tar tzf bizreflex-nestjs-kpax-*.tgz > files.txt
          grep -q '^package/dist/index.js$' files.txt
          grep -q '^package/dist/index.d.ts$' files.txt
          if grep -q 'kpax-openapi.json' files.txt; then echo "spec must not be packed"; exit 1; fi
