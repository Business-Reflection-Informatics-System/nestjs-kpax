name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $PKG"; exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Pack
        id: pack
        run: |
          npm pack
          FILE="$(ls bizreflex-nestjs-kpax-*.tgz)"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha512sum "$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## "v" " || $0 ~ "^## "v"$" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ### Install

          \`\`\`bash
          npm install https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.pack.outputs.file }}
          \`\`\`

          SHA-512: \`${{ steps.pack.outputs.sha }}\`
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
